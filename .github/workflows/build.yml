name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Build
        run: dotnet build -c Release --nologo

      - name: Verify app behavior and Android tools setup
        shell: powershell
        run: |
          dotnet run --project tests/AndroidTools.Tests.csproj -c Release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./tests/install-android-tools.tests.ps1

      - name: Publish (self-contained, single file, win-x64)
        run: dotnet publish -c Release -r win-x64 --self-contained -p:PublishSingleFile=true -p:DebugType=none -o publish --nologo

      - name: Package
        shell: pwsh
        run: Compress-Archive -Path publish\* -DestinationPath MuMuDeviceFrames-win-x64.zip

      - name: Installer (Inno Setup)
        shell: pwsh
        run: |
          $iscc = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6\ISCC.exe'
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress; if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE } }
          & $iscc installer\MuMuDeviceFrames.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Checksums
        shell: pwsh
        run: |
          $assets = 'MuMuDeviceFrames-win-x64.zip', 'installer/Output/MuMuDeviceFrames-Setup.exe'
          $assets | ForEach-Object {
            $hash = (Get-FileHash -LiteralPath $_ -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $(Split-Path $_ -Leaf)"
          } | Set-Content SHA256SUMS.txt -Encoding ascii

      - uses: actions/upload-artifact@v4
        with:
          name: MuMuDeviceFrames-win-x64
          path: |
            MuMuDeviceFrames-win-x64.zip
            installer/Output/MuMuDeviceFrames-Setup.exe
            SHA256SUMS.txt

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            MuMuDeviceFrames-win-x64.zip
            installer/Output/MuMuDeviceFrames-Setup.exe
            SHA256SUMS.txt
          generate_release_notes: true
