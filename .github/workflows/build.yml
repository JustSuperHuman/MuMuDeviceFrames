name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Build
        run: dotnet build -c Release --nologo

      - name: Publish (self-contained, single file, win-x64)
        run: dotnet publish -c Release -r win-x64 --self-contained -p:PublishSingleFile=true -p:DebugType=none -o publish --nologo

      - name: Package
        shell: pwsh
        run: Compress-Archive -Path publish\* -DestinationPath MuMuDeviceFrames-win-x64.zip

      - uses: actions/upload-artifact@v4
        with:
          name: MuMuDeviceFrames-win-x64
          path: MuMuDeviceFrames-win-x64.zip

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: MuMuDeviceFrames-win-x64.zip
          generate_release_notes: true
